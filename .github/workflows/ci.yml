name: CI
on:
  push:
    branches: [main, "t1-*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-python@v5 # a few tests read the report docx and run kb/clean.py
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      # The KB retrieval evaluation already runs inside `npm test` (tests/un-eval.test.ts, tests/un-vector.test.ts);
      # `npm run kb:score` prints the full recall@5 / MRR tables (kb/eval/RESULTS.md).
